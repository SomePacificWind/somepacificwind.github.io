<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>I hope it gets to you on some pacific wind.</title>
<style>
body {
  max-width:700px;
  margin:40px auto;
  font-family:system-ui;
  padding:0 20px;
}
</style>
</head>
<body>
<h1>你好，欢迎来到我的个人主页，美丽的蔡小姐</h1>
<p>现在出去！</p>
<audio id="bgm" loop>
<source src="audio/bgm.mp3" type="audio/mpeg">
<script>
const bgm = document.getElementById("bgm");
// 用户点击页面任意位置，播放一次
document.addEventListener("click", ()=>{
  bgm.play();
}, {once:true}) // once:true 只触发一次
</script>
</body>
</html>
